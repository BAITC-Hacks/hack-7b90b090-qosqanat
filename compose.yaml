services:
  scenario:
    build: .
    command: pnpm exec tsx apps/scenario-service/src/index.ts
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET with at least 24 characters in .env}
      DATABASE_PATH: /data/voice-router.sqlite
    volumes:
      - history:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  gateway:
    build: .
    command: pnpm exec tsx apps/gateway/src/index.ts
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in .env}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD with at least 12 characters in .env}
      REALTIME_MODEL: ${REALTIME_MODEL:-gpt-realtime-2.1}
      REALTIME_FALLBACK_MODEL: ${REALTIME_FALLBACK_MODEL:-gpt-realtime}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-4.1-mini}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-live-transcribe}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      SCENARIO_URL: http://scenario:3002
    depends_on:
      scenario:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  web:
    build: .
    environment:
      GATEWAY_URL: http://gateway:3001
    ports:
      - '3000:3000'
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
volumes:
  history:
